name: Test formula

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    steps:
    - uses: actions/checkout@v5
    # Taps this repository itself, as gilfeather/tap
    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@main
    - name: Install from this checkout
      run: |
        brew install gilfeather/tap/furnace
        brew test gilfeather/tap/furnace
        brew audit --strict gilfeather/tap/furnace
